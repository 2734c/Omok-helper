plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omokhelper'
    compileSdk 34

    defaultConfig {
        applicationId "com.omokhelper"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 모든 빌드를 같은 키로 서명한다. (CI 서버는 빌드마다 새 임시 디버그 키를 만들어서,
    // 그대로 두면 업데이트 설치가 거부되고 기기 코드도 바뀐다.)
    // 이 키는 업데이트 설치용이며 비밀이 아니다 (저장소에 공개되어 있음).
    signingConfigs {
        stable {
            storeFile file('../signing/omok.keystore')
            storePassword 'omokhelper'
            keyAlias 'omok'
            keyPassword 'omokhelper'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
        debug {
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
