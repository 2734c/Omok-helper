plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omokhelper'
    compileSdk 34

    defaultConfig {
        applicationId "com.omokhelper"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 수행평가용: 별도 서명키 없이 설치할 수 있도록 디버그 키로 서명
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
