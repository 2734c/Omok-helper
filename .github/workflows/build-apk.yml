name: APK 빌드

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 테스트 + APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk OmokHelper.apk

      - name: 빌드 결과 업로드 (Actions 탭에서 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: OmokHelper-apk
          path: OmokHelper.apk

      - name: 최신 APK 릴리스 갱신 (휴대폰에서 바로 다운로드)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OmokHelper.apk \
            --title "오목 도우미 최신 APK" \
            --notes "브랜치 ${{ github.ref_name }} / 커밋 ${{ github.sha }} 에서 자동 빌드되었습니다." \
            --target ${{ github.sha }}
